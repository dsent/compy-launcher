name: Package signed launcher

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    environment: android-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK packages
        run: >-
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-37" "build-tools;37.0.0"
      - name: Build and verify signed release
        shell: bash
        env:
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_KEYPASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEYPASSWORD }}
          ANDROID_KEYSTORE_STOREPASSWORD: ${{ secrets.ANDROID_KEYSTORE_STOREPASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail

          for name in \
              ANDROID_KEYSTORE_ALIAS \
              ANDROID_KEYSTORE_BASE64 \
              ANDROID_KEYSTORE_KEYPASSWORD \
              ANDROID_KEYSTORE_STOREPASSWORD \
              EXPECTED_CERT_SHA256; do
            [[ -n ${!name:-} ]] || {
              printf 'Missing Android signing value: %s\n' "$name" >&2
              exit 1
            }
          done

          keystore_path="$RUNNER_TEMP/compy-android-release.p12"
          trap 'rm -f -- "$keystore_path"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"

          build_date=$(date -u +%Y%m%d)
          build_name="$build_date-${GITHUB_SHA::7}"
          export COMPY_ANDROID_KEYSTORE_PATH="$keystore_path"
          export COMPY_ANDROID_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_STOREPASSWORD"
          export COMPY_ANDROID_KEY_ALIAS="$ANDROID_KEYSTORE_ALIAS"
          export COMPY_ANDROID_KEY_PASSWORD="$ANDROID_KEYSTORE_KEYPASSWORD"
          export VERSION_NAME="$build_name"
          export VERSION_CODE="$build_date"
          export OUTPUT_APK="toys.compy.launcher-$build_name.apk"

          ./gradlew --no-daemon assembleRelease

          apk_path="app/build/outputs/apk/release/$OUTPUT_APK"
          apksigner="$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner"
          verification=$("$apksigner" verify --print-certs "$apk_path")
          printf '%s\n' "$verification"

          actual=
          while IFS= read -r line; do
            case $line in
              "Signer #1 certificate SHA-256 digest: "*) actual=${line##*: } ;;
            esac
          done <<< "$verification"
          actual=${actual//:/}
          actual=${actual// /}
          actual=${actual,,}
          expected=${EXPECTED_CERT_SHA256//:/}
          expected=${expected// /}
          expected=${expected,,}
          [[ -n $actual && $actual == "$expected" ]] || {
            printf 'Signing certificate mismatch: expected %s, got %s\n' \
              "$expected" "${actual:-missing}" >&2
            exit 1
          }
      - name: Upload signed launcher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compy-launcher-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
